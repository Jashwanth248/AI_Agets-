name: roadmate-ai-ci
on:
  push:
    paths: ["roadmate-ai/**"]
  pull_request:
    paths: ["roadmate-ai/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadmate-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ml
      - run: pytest -q
      - run: docker build -t roadmate-ai:${{ github.sha }} .
