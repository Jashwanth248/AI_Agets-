[project]
name = "llm-auditor-platform"
version = "2.0.0"
description = "Production-grade multi-agent LLM auditing, data quality, analytics and ML risk scoring on Google Cloud"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["geo_toolkit", "api", "analytics", "data_pipeline", "ml"]
omit = ["*/tests/*"]
